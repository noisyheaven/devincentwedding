<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pembuat Link Tamu</title>
<style>
:root{--wine:#800020;--tint:#f7eef0;--ink:#3a2a2e}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,Poppins,sans-serif;color:var(--ink);background:var(--tint)}
main{max-width:760px;margin:0 auto;padding:24px 16px 60px}
h1{color:var(--wine);font-family:Georgia,serif;margin:0 0 4px}
p.sub{margin:0 0 20px;color:#6b5a5f}
label{display:block;font-weight:600;margin:18px 0 6px}
input,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid #d9bcc3;border-radius:10px;background:#fff;color:var(--ink)}
textarea{resize:vertical}
button,a.btn{font:inherit;font-size:.9rem;border:1px solid var(--wine);background:#fff;color:var(--wine);border-radius:99px;padding:6px 14px;cursor:pointer;text-decoration:none;display:inline-block}
button.main{background:var(--wine);color:#fff}
button:hover,a.btn:hover{filter:brightness(.95)}
.row{background:#fff;border:1px solid #ecd9dd;border-radius:14px;padding:12px;margin-top:10px}
.row b{display:block;margin-bottom:6px}
.row input{font-size:.85rem;margin-bottom:8px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.bar{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:8px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--wine);color:#fff;padding:8px 18px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
</style>
</head>
<body>
<main>
  <h1>Pembuat Link Tamu</h1>
  <p class="sub">Tempel daftar nama, lalu kirim link pribadi lewat WhatsApp. Nama tamu akan tampil di sampul undangan dan terisi otomatis di form ucapan.</p>

  <label for="base">Alamat undangan</label>
  <input id="base" value="https://devincentwedding.noisyheaven.workers.dev/">

  <label for="tpl">Isi pesan (gunakan {nama} dan {link})</label>
  <textarea id="tpl" rows="11">Kepada Yth. {nama},

Dengan penuh syukur kepada Tuhan Yesus Kristus, kami mengundang Anda untuk hadir dan memberikan doa restu pada pernikahan kami, Vincensius &amp; Devi.

Sabtu, 26 Desember 2026
Pemberkatan: 11.00 WIB, Gereja Katolik Santo Hieronimus
Resepsi: 17.00 WIB, G Hotel Pontianak

Detail undangan:
{link}

Terima kasih 🙏</textarea>

  <label for="names">Daftar nama tamu (satu nama per baris)</label>
  <textarea id="names" rows="8" placeholder="Budi Santoso&#10;Keluarga Bapak Andi&#10;Ibu Siti &amp; Keluarga"></textarea>

  <div class="bar"><strong id="count"></strong><button type="button" class="main" id="copyAll">Salin semua (Nama + Link)</button></div>
  <div id="out"></div>
</main>
<div id="toast" role="status"></div>
<script>
(function () {
  var $ = function (i) { return document.getElementById(i); };
  var KEY = "guestlinks.v1";
  try { var s = JSON.parse(localStorage.getItem(KEY) || "{}"); if (s.base) $("base").value = s.base; if (s.tpl) $("tpl").value = s.tpl; if (s.names) $("names").value = s.names; } catch (e) {}

  function toast(t) { var e = $("toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(function () { e.classList.remove("on"); }, 1600); }
  function copy(t) {
    function ok() { toast("Tersalin"); }
    function fb() { var a = document.createElement("textarea"); a.value = t; a.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(a); a.select(); try { document.execCommand("copy"); ok(); } catch (e) { toast("Gagal menyalin"); } a.remove(); }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(ok, fb); else fb();
  }
  function link(name) { return $("base").value.trim().replace(/[?#].*$/, "") + "?to=" + encodeURIComponent(name.slice(0, 60)); }
  function msg(name, l) { return $("tpl").value.replace(/\{nama\}/g, name).replace(/\{link\}/g, l); }
  function names() { return $("names").value.split(/\r?\n/).map(function (n) { return n.trim(); }).filter(Boolean); }
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; }
  function btn(label, fn) { var b = el("button", "", label); b.type = "button"; b.addEventListener("click", fn); return b; }

  function render() {
    var L = names(), out = $("out"); out.innerHTML = "";
    $("count").textContent = L.length + " tamu";
    try { localStorage.setItem(KEY, JSON.stringify({ base: $("base").value, tpl: $("tpl").value, names: $("names").value })); } catch (e) {}
    L.forEach(function (n) {
      var l = link(n), r = el("div", "row"), i = el("input"), a = el("div", "acts");
      i.value = l; i.readOnly = true; i.setAttribute("aria-label", "Link untuk " + n);
      i.addEventListener("focus", function () { i.select(); });
      var wa = el("a", "btn", "Kirim WhatsApp"); wa.target = "_blank"; wa.rel = "noopener";
      wa.href = "https://wa.me/?text=" + encodeURIComponent(msg(n, l));
      a.appendChild(wa);
      a.appendChild(btn("Salin pesan", function () { copy(msg(n, l)); }));
      a.appendChild(btn("Salin link", function () { copy(l); }));
      r.appendChild(el("b", "", n)); r.appendChild(i); r.appendChild(a); out.appendChild(r);
    });
  }
  $("copyAll").addEventListener("click", function () { copy(names().map(function (n) { return n + "\t" + link(n); }).join("\n")); });
  ["base", "tpl", "names"].forEach(function (id) { $(id).addEventListener("input", render); });
  render();
})();
</script>
</body>
</html>
