<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#800020">
<title>Momen Tamu • Vincensius &amp; Devi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--wine:#800020;--wine-d:#55001a;--ink:#3a2a2e;--tint:#f7eef0}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{font:300 16px/1.6 Poppins,system-ui,sans-serif;color:var(--ink);background:var(--tint);min-height:100vh}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit}

/* kepala */
header{position:relative;overflow:hidden;color:#fff;text-align:center;padding:calc(34px + env(safe-area-inset-top,0px)) 20px 30px;background:linear-gradient(150deg,#c4475f 0%,var(--wine) 55%,var(--wine-d) 100%)}
header:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.22),transparent 45%),radial-gradient(circle at 85% 90%,rgba(255,214,150,.25),transparent 40%)}
header>*{position:relative}
.kick{letter-spacing:.3em;text-transform:uppercase;font-size:.72rem;opacity:.9}
h1{font:400 clamp(2.2rem,9vw,3.2rem)/1.1 Italiana,serif;margin:6px 0 4px}
.sub{font-size:.9rem;opacity:.92;max-width:34ch;margin:0 auto}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid #fff;color:#fff;border-radius:99px;padding:9px 22px;font:400 .92rem Poppins,sans-serif;text-decoration:none;background:rgba(255,255,255,.12)}
.pill.solid{background:#fff;color:var(--wine);font-weight:500}
.pill:active{transform:scale(.97)}
.count{display:inline-block;margin-top:16px;font-size:.8rem;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:4px 14px}

/* galeri */
main{max-width:1200px;margin:0 auto;padding:18px 12px 60px}
#grid{columns:2;column-gap:10px}
@media(min-width:640px){#grid{columns:3;column-gap:14px}main{padding:26px 20px 70px}}
@media(min-width:1000px){#grid{columns:4}}
.ph{break-inside:avoid;margin:0 0 10px;background:#fff;border-radius:6px;padding:6px 6px 8px;box-shadow:0 6px 18px rgba(128,0,32,.12);cursor:pointer;display:block;width:100%;text-align:left;transition:transform .2s}
@media(min-width:640px){.ph{margin-bottom:14px}}
.ph:hover{transform:translateY(-3px) rotate(-.4deg)}
.ph .im{display:block;width:100%;aspect-ratio:var(--ar,3/4);background:#ead9dd;border-radius:3px;overflow:hidden}
.ph img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
.ph img.ok{opacity:1}
.ph .by{display:block;margin-top:6px;font-size:.74rem;color:#8a7378;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.ph.new{animation:pop .7s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{0%{opacity:0;transform:scale(.8) rotate(-3deg)}100%{opacity:1;transform:none}}
.empty,.msg{text-align:center;color:#8a7378;padding:40px 16px;background:#fff;border:1px dashed #e3c7ce;border-radius:16px;margin:10px 0}
.msg.err{color:#8a3d4c}
.foot{text-align:center;font-size:.76rem;color:#8a7378;margin-top:24px}

/* lightbox */
#lb{position:fixed;inset:0;z-index:50;background:rgba(14,4,8,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:pan-y}
#lb .stage{position:relative;flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;padding:calc(56px + env(safe-area-inset-top,0px)) 12px 8px}
#lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px;box-shadow:0 10px 50px #000}
#lb .cap{color:#fff;text-align:center;padding:4px 16px calc(18px + env(safe-area-inset-bottom,0px));font-size:.9rem}
#lb .cap small{display:block;opacity:.65;font-size:.74rem}
#lb .cap a{display:inline-block;margin-top:8px;border:1px solid rgba(255,255,255,.5);border-radius:99px;padding:5px 16px;font-size:.8rem;text-decoration:none}
.lbb{position:absolute;color:#fff;font-size:1.7rem;line-height:1;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center}
.lbb:active{background:rgba(255,255,255,.28)}
#lbx{top:calc(8px + env(safe-area-inset-top,0px));right:10px;z-index:3}
#lbp{left:8px;top:50%;margin-top:-24px;z-index:3}#lbn{right:8px;top:50%;margin-top:-24px;z-index:3}

/* MODE LAYAR (?tv=1): slideshow untuk layar/proyektor resepsi */
body.tv{background:#0e0408;overflow:hidden;cursor:none}
body.tv header,body.tv main,body.tv #lb{display:none!important}
#tv{position:fixed;inset:0;background:#0e0408;color:#fff;display:none}
body.tv #tv{display:block}
#tv .sl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 1.2s}
#tv .sl.on{opacity:1}
#tv .blur{position:absolute;inset:-5%;background-size:cover;background-position:center;filter:blur(40px) brightness(.5)}
#tv .sl img{position:relative;max-width:92vw;max-height:84vh;border:10px solid #fff;border-bottom-width:46px;border-radius:3px;box-shadow:0 20px 70px #000;transform:rotate(var(--r,0deg))}
#tv .cap{position:absolute;left:0;right:0;bottom:3.5vh;text-align:center;font:italic 500 clamp(1rem,2.4vw,1.8rem) "Playfair Display",serif;text-shadow:0 2px 12px #000}
#tv .tag{position:absolute;left:28px;top:22px;font:400 clamp(1.2rem,2.6vw,2rem) Italiana,serif;letter-spacing:.06em;opacity:.9;text-shadow:0 2px 10px #000;z-index:2}
#tv .qr{position:absolute;right:28px;top:22px;font-size:clamp(.7rem,1.4vw,1rem);opacity:.85;text-align:right;z-index:2;text-shadow:0 2px 10px #000}
#tv .none{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:400 clamp(1.4rem,3vw,2.4rem) Italiana,serif;padding:20px}
</style>
</head>
<body>

<header>
  <p class="kick">Pernikahan</p>
  <h1>Momen Tamu</h1>
  <p class="sub">Foto-foto dari disposable camera para tamu Vincensius &amp; Devi</p>
  <div class="acts">
    <a class="pill solid" href="kamera.html">📷 Ambil Foto</a>
    <a class="pill" href="?tv=1">🖥️ Mode Layar</a>
  </div>
  <span class="count" id="count" hidden></span>
</header>

<main>
  <div id="note"></div>
  <div id="grid"></div>
  <p class="foot" id="foot" hidden>Galeri diperbarui otomatis.</p>
</main>

<div id="lb" hidden>
  <button class="lbb" id="lbx" aria-label="Tutup">✕</button>
  <button class="lbb" id="lbp" aria-label="Sebelumnya">‹</button>
  <button class="lbb" id="lbn" aria-label="Berikutnya">›</button>
  <div class="stage"><img id="lbi" alt=""></div>
  <div class="cap"><span id="lbc"></span><small id="lbt"></small><a id="lbd" href="#" target="_blank" rel="noopener">⬇ Unduh</a></div>
</div>

<div id="tv"></div>

<script src="js/camera-config.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var URL_ = window.CAM_URL || "";
  var TV = new URLSearchParams(location.search).get("tv") === "1";
  var POLL = TV ? 12000 : 15000;
  var items = [], seen = {}, first = true;

  function thumb(id, w) { return "https://lh3.googleusercontent.com/d/" + id + "=w" + w; }
  function alt(id, w) { return "https://drive.google.com/thumbnail?id=" + id + "&sz=w" + w; }
  function loadImg(img, id, w) {   // coba lh3, bila gagal pakai thumbnail Drive
    img.onload = function () { img.classList.add("ok"); };
    img.onerror = function () { img.onerror = function () {}; img.src = alt(id, w); img.onload = function () { img.classList.add("ok"); }; };
    img.src = thumb(id, w);
  }
  function esc(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
  function ago(t) {
    var s = Math.max(0, (Date.now() - t) / 1000);
    if (s < 60) return "baru saja";
    if (s < 3600) return Math.floor(s / 60) + " menit lalu";
    if (s < 86400) return Math.floor(s / 3600) + " jam lalu";
    return new Date(t).toLocaleDateString("id-ID", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  }

  /* ---------- ambil data ---------- */
  function setNote(html, cls) { $("note").innerHTML = html ? '<div class="' + (cls || "msg") + '">' + html + "</div>" : ""; }
  function fetchList() {
    if (!URL_) { setNote("Galeri belum disambungkan. Isi <b>CAM_URL</b> di <code>js/camera-config.js</code> (lihat SETUP-KAMERA.txt)."); return; }
    fetch(URL_).then(function (r) { return r.json(); }).then(function (j) {
      if (!j || !j.ok) throw new Error("bad");
      setNote("");
      update(j.items || [], j.total || 0);
    }).catch(function () {
      if (first) setNote("Gagal memuat foto. Periksa sinyal, lalu muat ulang halaman.", "msg err");
    }).then(function () { first = false; });
  }

  /* ---------- galeri ---------- */
  function update(list, total) {
    var fresh = list.filter(function (x) { return !seen[x.i]; });
    var firstLoad = !Object.keys(seen).length;
    list.forEach(function (x) { seen[x.i] = 1; });
    items = list;
    if (TV) { tvUpdate(fresh, firstLoad); return; }

    $("count").hidden = !total; $("count").textContent = "📷 " + total + " foto";
    $("foot").hidden = !total;
    var g = $("grid");
    if (!list.length) { g.innerHTML = ""; setNote("Belum ada foto. Jadilah yang pertama memotret! 📷", "empty"); return; }
    if (firstLoad) {
      g.innerHTML = "";
      list.forEach(function (x) { g.appendChild(card(x, false)); });
    } else {   // foto baru muncul di paling atas
      fresh.slice().reverse().forEach(function (x) { g.insertBefore(card(x, true), g.firstChild); });
    }
  }
  function card(x, isNew) {
    var b = document.createElement("button");
    b.className = "ph" + (isNew ? " new" : "");
    b.type = "button";
    b.innerHTML = '<span class="im"><img alt="Foto oleh ' + esc(x.n) + '" loading="lazy" decoding="async"></span><span class="by">' + esc(x.n) + "</span>";
    var img = b.querySelector("img");
    img.addEventListener("load", function () {   // ikuti rasio asli foto
      if (img.naturalWidth && img.naturalHeight) b.querySelector(".im").style.setProperty("--ar", img.naturalWidth + "/" + img.naturalHeight);
    });
    loadImg(img, x.i, 600);
    b.addEventListener("click", function () { openLb(x.i); });
    return b;
  }

  /* ---------- lightbox ---------- */
  var cur = -1;
  function idx(id) { for (var i = 0; i < items.length; i++) if (items[i].i === id) return i; return -1; }
  function openLb(id) { cur = idx(id); if (cur < 0) return; $("lb").hidden = false; document.body.style.overflow = "hidden"; showLb(); }
  function closeLb() { $("lb").hidden = true; document.body.style.overflow = ""; $("lbi").removeAttribute("src"); }
  function showLb() {
    var x = items[cur]; if (!x) return;
    var im = $("lbi"); im.style.opacity = .35;
    im.onload = function () { im.style.opacity = 1; };
    im.onerror = function () { im.onerror = null; im.src = alt(x.i, 1600); };
    im.src = thumb(x.i, 1600);
    $("lbc").textContent = "📷 " + x.n; $("lbt").textContent = ago(x.t);
    $("lbd").href = "https://drive.google.com/uc?export=download&id=" + x.i;
    [cur - 1, cur + 1].forEach(function (k) { if (items[k]) new Image().src = thumb(items[k].i, 1600); });   // siapkan foto sebelah
  }
  function step(d) { var n = cur + d; if (n < 0 || n >= items.length) return; cur = n; showLb(); }
  $("lbx").addEventListener("click", closeLb);
  $("lbp").addEventListener("click", function () { step(-1); });
  $("lbn").addEventListener("click", function () { step(1); });
  $("lb").addEventListener("click", function (e) { if (e.target === $("lb") || e.target.classList.contains("stage")) closeLb(); });
  document.addEventListener("keydown", function (e) {
    if ($("lb").hidden) return;
    if (e.key === "Escape") closeLb(); else if (e.key === "ArrowLeft") step(-1); else if (e.key === "ArrowRight") step(1);
  });
  var sx = 0;
  $("lb").addEventListener("touchstart", function (e) { sx = e.touches[0].clientX; }, { passive: true });
  $("lb").addEventListener("touchend", function (e) {
    var dx = e.changedTouches[0].clientX - sx;
    if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
  }, { passive: true });

  /* ---------- MODE LAYAR ---------- */
  var tvEl = $("tv"), tvIdx = 0, tvTimer = 0, tvShown = "", tvQueue = [];
  function tvBuild() {
    tvEl.innerHTML = '<div class="tag">Vincensius &amp; Devi</div><div class="qr">📷 Ambil fotomu di<br><b>' + esc(location.host + "/kamera.html") + '</b></div><div class="none" id="tvNone">Menunggu foto pertama dari para tamu… 📷</div>';
  }
  function tvShow(x) {
    if (!x) return;
    tvShown = x.i;
    var none = $("tvNone"); if (none) none.remove();
    var s = document.createElement("div"); s.className = "sl";
    s.style.setProperty("--r", (Math.random() * 3 - 1.5).toFixed(1) + "deg");
    s.innerHTML = '<div class="blur"></div><img alt=""><div class="cap">📷 ' + esc(x.n) + "</div>";
    var img = s.querySelector("img"), blur = s.querySelector(".blur");
    blur.style.backgroundImage = "url(" + thumb(x.i, 400) + ")";
    var done = function () {
      tvEl.appendChild(s); void s.offsetWidth; s.classList.add("on");
      var olds = tvEl.querySelectorAll(".sl");
      for (var i = 0; i < olds.length - 1; i++) (function (o) { o.classList.remove("on"); setTimeout(function () { o.remove(); }, 1300); })(olds[i]);
    };
    img.onload = done;
    img.onerror = function () { img.onerror = done; img.src = alt(x.i, 1600); };
    img.src = thumb(x.i, 1600);
  }
  function tvNext() {
    clearTimeout(tvTimer);
    var x = tvQueue.length ? tvQueue.shift() : items[tvIdx++ % Math.max(1, items.length)];   // foto baru didahulukan
    tvShow(x);
    tvTimer = setTimeout(tvNext, 7000);
  }
  function tvUpdate(fresh, firstLoad) {
    if (!items.length) return;
    if (firstLoad) { tvIdx = 0; tvNext(); return; }
    fresh.slice().reverse().forEach(function (x) { tvQueue.push(x); });
    if (fresh.length && tvQueue.length === fresh.length) tvNext();   // tampil segera bila belum ada antrean
  }

  /* ---------- jalan ---------- */
  if (TV) { document.body.classList.add("tv"); tvBuild(); }
  fetchList();
  var poll = setInterval(function () { if (!document.hidden) fetchList(); }, POLL);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) fetchList(); });
  if (TV) document.addEventListener("dblclick", function () {   // klik dua kali = layar penuh
    if (document.fullscreenElement) document.exitFullscreen(); else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  });
})();
</script>
</body>
</html>
